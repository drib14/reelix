# Reelix Production NGINX Reverse Proxy & Load Balancer Configuration

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Backend Load Balancer Cluster
    upstream reelix_backend_cluster {
        least_conn; # Distribute traffic to the server with fewest active connections
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.reelix.com;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.reelix.com;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/api.reelix.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.reelix.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Proxy requests to backend cluster
        location / {
            proxy_pass http://reelix_backend_cluster;
            proxy_http_version 1.1;

            # Header Forwarding
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint for Cloud Load Balancers
        location /health {
            proxy_pass http://reelix_backend_cluster/health;
            access_log off;
        }
    }
}
